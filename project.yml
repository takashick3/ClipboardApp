name: ClipboardApp
options:
  bundleIdPrefix: com.takashick3
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    PRODUCT_NAME: ClipboardApp
    PRODUCT_BUNDLE_IDENTIFIER: com.takashick3.ClipboardApp

schemes:
  ClipboardApp:
    build:
      targets:
        ClipboardApp: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  ClipboardApp:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: ClipboardApp
        type: group
    dependencies:
      - sdk: ServiceManagement.framework
    settings:
      base:
        PRODUCT_NAME: ClipboardApp
        PRODUCT_BUNDLE_IDENTIFIER: com.takashick3.ClipboardApp
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        INFOPLIST_FILE: ClipboardApp/Info.plist
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "YES"
        CODE_SIGNING_ALLOWED: "YES"
        ENABLE_HARDENED_RUNTIME: "NO"
        COMBINE_HIDPI_IMAGES: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ClipboardApp/Info.plist
      properties:
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSHighResolutionCapable: true
        CFBundleShortVersionString: "1.1.2"
        CFBundleVersion: "4"
        CFBundleLocalizations: [ja, en]
        CFBundleDevelopmentRegion: ja
        NSAppleEventsUsageDescription: "クリップボードの内容を貼り付けるために使用します。"
        NSAccessibilityUsageDescription: "他のアプリへの自動ペーストに使用します。"
